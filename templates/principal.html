<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; text-align: center; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .btn { display: inline-block; padding: 10px 20px; margin: 10px; text-decoration: none; border-radius: 4px; color: white; }
        .btn-search { background-color: #28a745; }
        .btn-search:hover { background-color: #218838; }
        .btn-exit { background-color: #dc3545; }
        .btn-exit:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido al Sistema</h1>
        <p>Hola, <strong>{{ nombre }}</strong>. ¿Qué deseas hacer hoy?</p>
        
        <a href="/buscador" class="btn btn-search">Buscador de Productos</a>
        <a href="/logout" class="btn btn-exit">Salir del Sistema</a>
    </div>
</body>
</html>
